name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests (downloads, streams, bridge)
        run: python -m unittest discover -s app -p "test_*.py" -v
      - name: Desktop window test
        working-directory: app
        run: python test_ui.py
      - name: Browser extension tests
        run: node test_extension.cjs
