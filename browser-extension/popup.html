<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Free-to-Download</title><link rel="stylesheet" href="style.css"></head><body><h1>Free-to-Download</h1><p>Send direct file links to your desktop queue.</p><textarea id="urls" aria-label="Download URLs" placeholder="One HTTP or HTTPS URL per line"></textarea><div class="actions"><button id="send">Send URLs</button><button id="scan" class="secondary">Find page links</button></div><div id="links"></div><button id="selected" hidden>Download selected</button><p id="status" role="status"></p><button id="settings" class="secondary">Settings</button><p class="hint">Page scanning runs only when you click. Blob URLs and protected streaming media are not supported.</p><script src="popup.js"></script></body></html>
